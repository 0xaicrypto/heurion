<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heurion</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-6 2 104 96'%3E%3Crect x='-6' y='2' width='104' height='96' rx='22' fill='%230F172A'/%3E%3Crect x='6' y='18' width='16' height='66' rx='8' fill='%23F8FAFC'/%3E%3Crect x='60' y='35' width='16' height='49' rx='8' fill='%23F8FAFC'/%3E%3Crect x='18' y='45' width='46' height='16' rx='8' fill='%230EA5E9'/%3E%3Ccircle cx='76' cy='24' r='10' fill='%230EA5E9'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">
  <aside class="nav">
    <div class="brand">
      <svg class="mark" viewBox="-2 6 96 88" aria-hidden="true"><rect class="mark-ink" x="0" y="10" width="18" height="80" rx="9"/><rect class="mark-ink" x="62" y="30" width="18" height="60" rx="9"/><rect class="mark-sky" x="14" y="42" width="52" height="18" rx="9"/><circle class="mark-sky" cx="80" cy="20" r="11"/></svg>
      <div class="wordmark"><span class="name">HEURION</span><span class="tagline">CLINICAL AI WORKSTATION</span></div>
    </div>
    <div class="actions">
      <button id="newDoc" class="sky block">＋ 新建文档</button>
      <div class="split">
        <button id="newDeck" class="ghost-dark">新建幻灯片</button>
        <button id="uploadBtn" class="ghost-dark" title="导入 docx / pptx">上传文件</button>
      </div>
      <input id="uploadInput" type="file" accept=".docx,.pptx" hidden>
    </div>
    <div class="nav-label">文档</div>
    <ul class="doclist" id="docList"></ul>
    <div class="user">
      <button id="userButton" class="user-button" aria-haspopup="menu" title="账户">
        <span class="avatar" id="userAvatar"></span>
        <span class="user-text"><span id="userName" class="user-name"></span><span id="userRole" class="user-role"></span></span>
        <span class="caret" aria-hidden="true">⌃</span>
      </button>
      <div class="user-menu" id="userMenu" role="menu" hidden>
        <button data-action="settings" id="userMenuSettings" role="menuitem">个人设置</button>
        <button data-action="admin" id="userMenuAdmin" role="menuitem" hidden>用户管理</button>
        <button data-action="claim" id="userMenuClaim" role="menuitem" hidden title="把开发期（开发令牌）的文档转到你的账户">认领开发期文档</button>
        <button data-action="readview" id="userMenuReadView" role="menuitem" hidden title="当前文档在 AI 眼里的样子（块 id、rev、引用标记），排查问题用">开发者：读视图</button>
        <hr>
        <button data-action="everywhere" id="userMenuEverywhere" role="menuitem">退出所有设备</button>
        <button data-action="logout" role="menuitem">退出登录</button>
      </div>
    </div>
  </aside>

  <main class="center">
    <header class="topbar">
      <span class="title" id="docTitle" title="点击重命名">未选择文档</span>
      <span class="status" id="syncStatus"></span>
      <div class="btn-group">
        <button id="exportDocxBtn" disabled>导出 docx</button>
        <button id="exportPptxBtn" disabled hidden>导出 pptx</button>
        <button id="exportMdBtn" disabled>导出 md</button>
      </div>
    </header>
    <div class="toolbar" id="toolbar" hidden>
      <select id="blockType" title="段落样式">
        <option value="p">正文</option>
        <option value="h1">标题 1</option>
        <option value="h2">标题 2</option>
        <option value="h3">标题 3</option>
      </select>
      <button data-cmd="bold" title="粗体 ⌘B"><b>B</b></button>
      <button data-cmd="italic" title="斜体 ⌘I"><i>I</i></button>
      <button data-cmd="underline" title="下划线 ⌘U"><u>U</u></button>
      <button data-cmd="sup" title="上标">x²</button>
      <button data-cmd="sub" title="下标">x₂</button>
      <span class="sep"></span>
      <button data-cmd="bulletList" title="无序列表">• 列表</button>
      <button data-cmd="orderedList" title="有序列表">1. 列表</button>
      <button data-cmd="table" title="插入表格">表格</button>
      <button data-cmd="image" title="插入图片（也可粘贴或拖入）">图片</button>
      <button data-cmd="cite" title="按 DOI 插入引用">引用</button>
      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif" multiple hidden>
      <span class="sep"></span>
      <button data-cmd="undo" title="撤销 ⌘Z">↶</button>
      <button data-cmd="redo" title="重做 ⌘⇧Z">↷</button>
    </div>
    <div class="suggest-banner" id="suggestBanner" hidden>
      <span class="dot"></span><span id="suggestSummary"></span>
      <span class="grow"></span>
      <button data-nav="-1" title="上一处修订">上一处</button>
      <button data-nav="1" title="下一处修订">下一处</button>
      <span class="sep"></span>
      <button data-all="0">全部拒绝</button>
      <button data-all="1" class="primary">全部采纳</button>
    </div>
    <div class="nudge" id="emailNudge" hidden>还没有绑定邮箱：绑定后忘记密码可以自助找回。<button data-nudge="bind" class="primary">去绑定</button><button data-nudge="later" class="quiet">不再提醒</button></div>
    <div class="notice" id="notice" hidden></div>
    <div class="scroller" id="scroller">
      <div class="page" id="page"><div class="empty"><svg class="mark" viewBox="-2 6 96 88" aria-hidden="true"><rect class="mark-ink" x="0" y="10" width="18" height="80" rx="9"/><rect class="mark-ink" x="62" y="30" width="18" height="60" rx="9"/><rect class="mark-sky" x="14" y="42" width="52" height="18" rx="9"/><circle class="mark-sky" cx="80" cy="20" r="11"/></svg><p>在左侧新建或上传文档</p></div></div>
    </div>
    <button id="commentFab" class="primary fab">评论</button>
  </main>

  <section class="side">
    <div class="tabs">
      <button data-tab="chatPane" class="active">对话</button>
      <button data-tab="commentPane">评论</button>
      <button data-tab="versionPane">版本</button>
      <button data-tab="citePane">引用</button>
    </div>
    <div class="tabpane active" id="chatPane">
      <div class="queue idle" id="queuePanel">
        <div class="queue-head"><span>任务队列</span><span class="queue-summary" id="queueSummary">空闲</span><span class="grow"></span><button id="queueClear" title="停止当前任务并清空排队" hidden>全部停止</button></div>
        <ol id="queueList"></ol>
      </div>
      <div class="log" id="chatLog"></div>
      <div class="composer">
        <textarea id="chatInput" rows="3" placeholder="让 Heurion 修改文档，例如：在方法部分补充纳入标准，并引用相关 RCT（⌘↩ 发送）"></textarea>
        <div class="row">
          <label class="toggle" title="AI 的修改作为待采纳修订，由你逐条采纳"><input type="checkbox" id="suggestMode"> 修订模式</label>
          <span class="grow"></span>
          <button id="cancelBtn" disabled>停止</button>
          <button id="sendBtn" class="ai" disabled>发送</button>
        </div>
      </div>
    </div>
    <div class="tabpane" id="commentPane">
      <div id="newComment" class="card" hidden>
        <div class="quote" id="newCommentQuote"></div>
        <textarea id="newCommentText" rows="2" placeholder="写下修改要求；含 @heurion 时 AI 自动处理"></textarea>
        <div class="row end">
          <button id="newCommentCancel">取消</button>
          <button id="newCommentSave">评论</button>
          <button id="newCommentAsk" class="ai">评论并让 AI 处理</button>
        </div>
      </div>
      <div id="comments"></div>
    </div>
    <div class="tabpane" id="versionPane"><div id="versions"></div><div id="diffView" class="diff"></div></div>
    <div class="tabpane" id="citePane"><div id="cites"></div></div>
  </section>
</div>
<div class="auth" id="authScreen" hidden>
  <div class="auth-card">
    <div class="auth-brand"><svg class="mark" viewBox="-2 6 96 88" aria-hidden="true"><rect class="mark-ink" x="0" y="10" width="18" height="80" rx="9"/><rect class="mark-ink" x="62" y="30" width="18" height="60" rx="9"/><rect class="mark-sky" x="14" y="42" width="52" height="18" rx="9"/><circle class="mark-sky" cx="80" cy="20" r="11"/></svg><div class="wordmark"><span class="name">HEURION</span><span class="tagline">CLINICAL AI WORKSTATION</span></div></div>
    <h1 class="auth-title">登录</h1>
    <p class="auth-sub"></p>
    <form id="authForm" class="form">
      <label>用户名<input type="text" id="authUsername" autocomplete="username" required maxlength="32"></label>
      <label id="authDisplayRow" hidden>显示名（选填）<input type="text" id="authDisplay" maxlength="40" placeholder="别人看到的名字，默认同用户名"></label>
      <label>密码<input type="password" id="authPassword" required></label>
      <div class="hp" aria-hidden="true"><label>网站<input type="text" id="authWebsite" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="muted" id="authHint" hidden>至少 8 位，同时包含字母和数字。</div>
      <div class="form-error" id="authError" role="alert"></div>
      <button class="sky block" id="authSubmit">登录</button>
    </form>
    <form id="resetForm" class="form" hidden>
      <label>绑定的邮箱<span class="field-row"><input type="text" id="resetEmail" autocomplete="email" inputmode="email" required><button type="button" id="resetSend">发送验证码</button></span></label>
      <label>验证码<input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
      <label>新密码<input type="password" id="resetPassword" autocomplete="new-password" required></label>
      <div class="muted">至少 8 位，同时包含字母和数字。重置后其他设备上的登录会失效。</div>
      <div class="form-note" id="resetNote"></div>
      <div class="form-error" id="resetError" role="alert"></div>
      <button class="sky block" id="resetSubmit">重置密码并登录</button>
    </form>
    <div class="auth-switch" id="authSwitch"></div>
    <a href="#" class="auth-dev" id="authDev" hidden>开发模式：使用开发令牌进入</a>
  </div>
</div>
<div class="dialog" id="dialog" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
