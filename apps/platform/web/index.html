<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heurion</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-6 2 104 96'%3E%3Crect x='-6' y='2' width='104' height='96' fill='%2306110D'/%3E%3Crect x='6' y='18' width='16' height='66' rx='8' fill='%23FFFFFF'/%3E%3Crect x='60' y='35' width='16' height='49' rx='8' fill='%23FFFFFF'/%3E%3Crect x='18' y='45' width='46' height='16' rx='8' fill='%2300FF93'/%3E%3Ccircle cx='76' cy='24' r='10' fill='%2300FF93'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#06110D">
  <script>
    // 首帧前设好主题（与 src/theme.ts 同一规则），避免先闪深色再变浅色
    try { var t = localStorage.getItem('heurion.theme'); if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; if (t === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').content = '#F4F7F5' } } catch (e) {}
  </script>
</head>
<body>
<div class="app" id="app">
  <aside class="nav">
    <nav class="rail" aria-label="工作空间">
      <div class="rail-mark" title="Heurion"><svg class="mark" viewBox="-2 6 96 88" aria-hidden="true"><rect class="mark-ink" x="0" y="10" width="18" height="80" rx="9"/><rect class="mark-ink" x="62" y="30" width="18" height="60" rx="9"/><rect class="mark-sky" x="14" y="42" width="52" height="18" rx="9"/><circle class="mark-sky" cx="80" cy="20" r="11"/></svg></div>
      <div class="rail-spaces" role="tablist" aria-orientation="vertical">
        <button class="rail-btn on" id="navDocs" data-space="write" role="tab" aria-selected="true" title="写作：文档与幻灯片"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.75h6.75L15.25 6.25v11H5z M11.75 2.75v3.5h3.5 M7.5 10h5 M7.5 13h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg><span>写作</span></button>
        <button class="rail-btn" id="navPatients" data-space="patients" role="tab" aria-selected="false" title="患者：上传化验单、看趋势、写病例报告（只用代号）"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.5" r="3.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.75 17.25c.7-3.4 3.2-5.25 6.25-5.25s5.55 1.85 6.25 5.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>患者</span></button>
        <button class="rail-btn" id="navResearch" data-space="research" role="tab" aria-selected="false" title="临床研究：方案、数据集、分析、稿件"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.75 2.75h4.5 M8.5 2.75v5L4 15.5c-.6 1.05.15 1.75 1.1 1.75h9.8c.95 0 1.7-.7 1.1-1.75L11.5 7.75v-5 M6 12.5h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg><span>研究</span></button>
      </div>
      <div class="rail-sep"></div>
      <button class="rail-btn" id="libraryBtn" title="参考资料库：上传论文、指南，AI 写作时检索"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.75 3.25h3.5v13.5h-3.5z M8.25 3.25h3.5v13.5h-3.5z M12.9 4.1l3.3-.9 3.3 12.6-3.3.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>资料库</span></button>
      <button class="rail-btn" id="trashBtn" title="回收站：删除的文档保留 30 天"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.75 5.25h12.5 M8 5.25V3.5h4v1.75 M5.25 5.25l.75 11.5h8l.75-11.5 M8.25 8.5v5.5 M11.75 8.5v5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg><span>回收站</span></button>
      <span class="grow"></span>
      <div class="user">
        <button id="userButton" class="user-button" aria-haspopup="menu" title="账户"><span class="avatar" id="userAvatar"></span></button>
      <div class="user-menu" id="userMenu" role="menu" hidden>
        <div class="user-menu-head"><span id="userName" class="user-name"></span><span id="userRole" class="user-role"></span></div>
        <button data-action="settings" id="userMenuSettings" role="menuitem">个人设置</button>
        <button data-action="memory" id="userMenuMemory" role="menuitem" title="AI 记住的写作偏好、术语和常用事实">记忆</button>
        <button data-action="tenant" id="userMenuTenant" role="menuitem" hidden>机构管理</button>
        <button data-action="admin" id="userMenuAdmin" role="menuitem" hidden title="平台运营：机构、用户、实例设置、审计">平台运营</button>
        <button data-action="claim" id="userMenuClaim" role="menuitem" hidden title="把开发期（开发令牌）的文档转到你的账户">认领开发期文档</button>
        <button data-action="readview" id="userMenuReadView" role="menuitem" hidden title="当前文档在 AI 眼里的样子（块 id、rev、引用标记），排查问题用">开发者：读视图</button>
        <div class="theme-row" id="themeSwitch" role="group" aria-label="外观"><span>外观</span><span class="seg"><button data-theme-pref="dark">深色</button><button data-theme-pref="light">浅色</button><button data-theme-pref="system" title="跟随系统的深色 / 浅色设置">系统</button></span></div>
        <hr>
        <button data-action="everywhere" id="userMenuEverywhere" role="menuitem">退出所有设备</button>
        <button data-action="logout" role="menuitem">退出登录</button>
      </div>
      </div>
    </nav>
    <div class="nav-panel">
      <div class="panel-head"><span class="panel-title" id="spaceTitle">写作</span><span class="panel-brand">HEURION</span></div>
      <div class="actions" id="docActions">
        <button id="newDoc" class="sky block">＋ 新建文档</button>
        <div class="split">
          <button id="newDeck" class="ghost-dark">新建幻灯片</button>
          <button id="uploadBtn" class="ghost-dark" title="导入 docx / pptx">上传文件</button>
        </div>
        <input id="uploadInput" type="file" accept=".docx,.pptx" hidden>
      </div>
      <div class="actions" id="ptActions" hidden>
        <button id="newPatientBig" class="sky block" title="新建患者（只有代号，不填姓名）">＋ 新建患者</button>
      </div>
      <div class="actions" id="rsActions" hidden>
        <button id="newStudy" class="sky block" title="新建一个研究项目：方案、数据集、分析、稿件放在一起">＋ 新建研究</button>
        <div class="split one"><button id="datasetsBtn" class="ghost-dark" title="全部数据集：上传研究数据表（CSV、Excel、SAS、SPSS、Stata）">数据集</button></div>
      </div>
      <div class="nav-search"><input type="search" id="docSearch" placeholder="搜索文档（标题与正文）" autocomplete="off"></div>
      <div class="nav-label"><span id="navLabel">文档</span>
        <button class="nav-add" id="newProject" title="新建项目（文件夹）">＋项目</button></div>
      <ul class="doclist" id="docList"></ul>
      <ul class="doclist" id="patientList" hidden></ul>
      <ul class="doclist" id="studyList" hidden></ul>
    </div>
  </aside>

  <main class="center">
    <header class="topbar">
      <button class="icon-btn narrow-only" id="navToggle" aria-label="文档列表" aria-controls="app"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button class="doc-context" id="docContext" hidden title="回到患者页"></button>
      <span class="title" id="docTitle" title="点击重命名">未选择文档</span>
      <span class="doc-collab" id="docCollab" hidden></span>
      <span class="status" id="syncStatus"></span>
      <div class="menu-wrap">
        <button id="exportBtn" disabled aria-haspopup="menu">导出 <span aria-hidden="true">▾</span></button>
        <div class="dropdown" id="exportMenu" role="menu" hidden>
          <button id="exportDocxBtn" role="menuitem">Word 文档<span class="muted">.docx</span></button>
          <button id="exportPptxBtn" role="menuitem" hidden>PowerPoint<span class="muted">.pptx</span></button>
          <button id="exportMdBtn" role="menuitem">Markdown<span class="muted">.md</span></button>
        </div>
      </div>
      <button class="narrow-only side-toggle" id="sideToggle" aria-label="打开对话与评论">AI 对话</button>
    </header>
    <div class="toolbar" id="toolbar" hidden>
      <select id="blockType" title="段落样式">
        <option value="p">正文</option>
        <option value="h1">标题 1</option>
        <option value="h2">标题 2</option>
        <option value="h3">标题 3</option>
      </select>
      <button data-cmd="bold" title="粗体 ⌘B"><b>B</b></button>
      <button data-cmd="italic" title="斜体 ⌘I"><i>I</i></button>
      <button data-cmd="underline" title="下划线 ⌘U"><u>U</u></button>
      <button data-cmd="sup" title="上标">x²</button>
      <button data-cmd="sub" title="下标">x₂</button>
      <span class="sep"></span>
      <button data-cmd="bulletList" title="无序列表">• 列表</button>
      <button data-cmd="orderedList" title="有序列表">1. 列表</button>
      <button data-cmd="table" title="插入表格">表格</button>
      <button data-cmd="image" title="插入图片（也可粘贴或拖入）">图片</button>
      <button data-cmd="cite" title="按 DOI 插入引用">引用</button>
      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif" multiple hidden>
      <span class="sep"></span>
      <button data-cmd="undo" title="撤销 ⌘Z">↶</button>
      <button data-cmd="redo" title="重做 ⌘⇧Z">↷</button>
    </div>
    <div class="suggest-banner" id="suggestBanner" hidden>
      <span class="dot"></span><span id="suggestSummary"></span>
      <span class="grow"></span>
      <button data-nav="-1" title="上一处修订">上一处</button>
      <button data-nav="1" title="下一处修订">下一处</button>
      <span class="sep"></span>
      <button data-all="0">全部拒绝</button>
      <button data-all="1" class="primary">全部采纳</button>
    </div>
    <div class="toolbar deck-toolbar" id="deckToolbar" hidden>
      <button data-dk="slide-add" title="在当前页后面加一页（选版式）">＋新页 ▾</button>
      <button data-dk="slide-del" title="删除当前页">删页</button>
      <button id="deckTheme" data-dk="theme" title="换模板：配色、字体、装饰与版式位置（整份幻灯片）">模板</button>
      <button data-dk="bg" title="当前页的背景色">背景</button>
      <span class="sep"></span>
      <button data-dk="textbox" title="在当前页插入文本框">＋文本框</button>
      <button data-dk="block" title="插入色块（标题条、强调卡片）">＋色块</button>
      <span class="menu-wrap">
        <button data-dk="image" title="插入图片">＋图片</button>
        <div class="dropdown" id="imageMenu" hidden>
          <button data-image-src="upload">上传图片…</button><button data-image-src="unsplash">从 Unsplash 搜索…</button>
        </div>
      </span>
      <button data-dk="table" title="插入表格（双击单元格改字）">＋表格</button>
      <span class="menu-wrap">
        <button data-dk="chart" title="插入原生图表（双击图表编辑数据；导出后 PowerPoint 里也能编辑数据）">＋图表 ▾</button>
        <div class="dropdown" id="chartMenu" hidden>
          <button data-chart-type="column">柱状图</button><button data-chart-type="bar">条形图</button><button data-chart-type="line">折线图</button>
          <button data-chart-type="area">面积图</button><button data-chart-type="pie">饼图</button><button data-chart-type="doughnut">圆环图</button>
        </div>
      </span>
      <input id="deckImageInput" type="file" accept="image/png,image/jpeg,image/gif" hidden>
      <span class="sep"></span>
      <button data-dk="fill" data-needs-shape title="填充色">填充</button>
      <button data-dk="color" data-needs-shape title="文字颜色">文字色</button>
      <button data-dk="smaller" data-needs-shape title="缩小字号">A−</button>
      <button data-dk="bigger" data-needs-shape title="放大字号">A＋</button>
      <button data-dk="bold" data-needs-shape title="粗体"><b>B</b></button>
      <button data-dk="align-left" data-needs-shape title="文字左对齐">≡</button>
      <button data-dk="align-center" data-needs-shape title="文字居中">☰</button>
      <span class="sep"></span>
      <span class="menu-wrap">
        <button data-dk="arrange" data-needs-shape title="对齐与等距（Shift+单击多选）">排列 ▾</button>
        <div class="dropdown" id="arrangeMenu" hidden>
          <button data-arrange="left">左对齐</button><button data-arrange="center">水平居中</button><button data-arrange="right">右对齐</button>
          <button data-arrange="top">顶端对齐</button><button data-arrange="middle">垂直居中</button><button data-arrange="bottom">底端对齐</button>
          <button data-distribute="horizontal" title="至少选 3 个">横向等距</button><button data-distribute="vertical" title="至少选 3 个">纵向等距</button>
        </div>
      </span>
      <button data-dk="chart-data" data-needs-chart hidden title="编辑图表的类别、系列、数值与标题（也可双击图表）">编辑数据</button>
      <button data-dk="row-add" data-needs-table hidden title="在所点单元格下方插一行">＋行</button>
      <button data-dk="col-add" data-needs-table hidden title="在所点单元格右侧插一列">＋列</button>
      <button data-dk="row-del" data-needs-table hidden title="删除所点单元格所在行">−行</button>
      <button data-dk="col-del" data-needs-table hidden title="删除所点单元格所在列">−列</button>
      <button data-dk="front" data-needs-shape title="置于顶层">置顶</button>
      <button data-dk="back" data-needs-shape title="置于底层">置底</button>
      <button data-dk="delete" data-needs-shape title="删除形状（Delete）">删除</button>
    </div>
    <div class="turn-banner" id="turnBanner" hidden>
      <span class="dot"></span><span id="turnSummary"></span>
      <span class="grow"></span>
      <button data-tnav="-1">上一处</button>
      <button data-tnav="1">下一处</button>
      <span class="sep"></span>
      <button data-tact="revert">撤销本轮</button>
      <button data-tact="close" class="quiet" aria-label="关闭">✕</button>
    </div>
    <div class="nudge" id="emailNudge" hidden>还没有绑定邮箱：绑定后忘记密码可以自助找回。<button data-nudge="bind" class="primary">去绑定</button><button data-nudge="later" class="quiet">不再提醒</button></div>
    <div class="notice" id="notice" hidden></div>
    <div class="scroller" id="scroller">
      <div class="page" id="page"></div>
    </div>
    <button id="commentFab" class="primary fab">评论</button>
  </main>

  <div class="scrim" id="scrim"></div>
  <section class="side">
    <div class="side-head narrow-only"><span class="eyebrow">Heurion AI</span><button class="icon-btn" id="sideClose" aria-label="关闭"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6"/></svg></button></div>
    <div class="tabs">
      <button data-tab="chatPane" class="active">对话</button>
      <button data-tab="commentPane">评论</button>
      <button data-tab="versionPane">版本</button>
      <button data-tab="citePane">引用</button>
    </div>
    <div class="tabpane active" id="chatPane">
      <div class="queue idle" id="queuePanel">
        <div class="queue-head"><span>任务队列</span><span class="queue-summary" id="queueSummary">空闲</span><span class="grow"></span><button id="queueClear" title="停止当前任务并清空排队" hidden>全部停止</button></div>
        <ol id="queueList"></ol>
      </div>
      <div class="log" id="chatLog"></div>
      <div class="composer">
        <div class="kb-picked" id="kbPicked" hidden></div>
        <div class="kb-picked" id="dsPicked" hidden></div>
        <div class="kb-picked" id="ptPicked" hidden></div>
        <div class="chat-images" id="chatImages" hidden></div>
        <textarea id="chatInput" rows="3" placeholder="让 Heurion 修改文档，例如：在方法部分补充纳入标准，并引用相关 RCT（⌘↩ 发送；可以粘贴或拖入图片）"></textarea>
        <div class="row">
          <div class="composer-opts">
            <label class="toggle" title="AI 的修改作为待采纳修订，由你逐条采纳"><input type="checkbox" id="suggestMode"> 修订模式</label>
            <label class="toggle" title="这一轮不使用、也不新增记忆"><input type="checkbox" id="noMemory"> 不用记忆</label>
            <button class="quiet small-btn" id="kbPickBtn" title="选资料库里的资料，让 AI 依据它们写">＋ 引用资料</button>
            <button class="quiet small-btn" id="ptPickBtn" title="选患者，让 AI 读这位患者的资料与化验（按诊疗组权限，记入访问记录）" hidden>＋ 引用患者</button>
            <button class="quiet small-btn" id="dsPickBtn" title="选上传的数据，让 AI 做统计分析（Table 1、生存曲线、组间比较……）">＋ 引用数据</button>
          </div>
          <button id="cancelBtn" disabled>停止</button>
          <button id="sendBtn" class="ai" disabled>发送</button>
        </div>
      </div>
    </div>
    <div class="tabpane" id="commentPane">
      <div id="newComment" class="card" hidden>
        <div class="quote" id="newCommentQuote"></div>
        <textarea id="newCommentText" rows="2" placeholder="写下修改要求；含 @heurion 时 AI 自动处理"></textarea>
        <div class="row end">
          <button id="newCommentCancel">取消</button>
          <button id="newCommentSave">评论</button>
          <button id="newCommentAsk" class="ai">评论并让 AI 处理</button>
        </div>
      </div>
      <div id="comments"></div>
    </div>
    <div class="tabpane" id="versionPane"><div id="versions"></div><div id="diffView" class="diff"></div></div>
    <div class="tabpane" id="citePane"><div id="cites"></div></div>
  </section>
</div>
<div class="auth" id="authScreen" hidden>
  <div class="auth-card">
    <div class="auth-brand"><svg class="mark" viewBox="-2 6 96 88" aria-hidden="true"><rect class="mark-ink" x="0" y="10" width="18" height="80" rx="9"/><rect class="mark-ink" x="62" y="30" width="18" height="60" rx="9"/><rect class="mark-sky" x="14" y="42" width="52" height="18" rx="9"/><circle class="mark-sky" cx="80" cy="20" r="11"/></svg><div class="wordmark"><span class="name">HEURION</span><span class="tagline">CLINICAL AI WORKSTATION</span></div></div>
    <h1 class="auth-title">登录</h1>
    <p class="auth-sub"></p>
    <form id="authForm" class="form">
      <label>用户名<input type="text" id="authUsername" autocomplete="username" required maxlength="32"></label>
      <label id="authDisplayRow" hidden>显示名（选填）<input type="text" id="authDisplay" maxlength="40" placeholder="别人看到的名字，默认同用户名"></label>
      <label>密码<input type="password" id="authPassword" required></label>
      <div class="hp" aria-hidden="true"><label>网站<input type="text" id="authWebsite" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="muted" id="authHint" hidden>至少 8 位，同时包含字母和数字。</div>
      <div class="form-error" id="authError" role="alert"></div>
      <button class="sky block" id="authSubmit">登录</button>
    </form>
    <form id="resetForm" class="form" hidden>
      <label>绑定的邮箱<span class="field-row"><input type="text" id="resetEmail" autocomplete="email" inputmode="email" required><button type="button" id="resetSend">发送验证码</button></span></label>
      <label>验证码<input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
      <label>新密码<input type="password" id="resetPassword" autocomplete="new-password" required></label>
      <div class="muted">至少 8 位，同时包含字母和数字。重置后其他设备上的登录会失效。</div>
      <div class="form-note" id="resetNote"></div>
      <div class="form-error" id="resetError" role="alert"></div>
      <button class="sky block" id="resetSubmit">重置密码并登录</button>
    </form>
    <div class="auth-switch" id="authSwitch"></div>
    <a href="#" class="auth-dev" id="authDev" hidden>开发模式：使用开发令牌进入</a>
  </div>
</div>
<div class="dialog" id="dialog" hidden></div>
<template id="welcomeTpl">
  <div class="welcome">
    <svg class="mark" viewBox="-2 6 96 88" aria-hidden="true"><rect class="mark-ink" x="0" y="10" width="18" height="80" rx="9"/><rect class="mark-ink" x="62" y="30" width="18" height="60" rx="9"/><rect class="mark-sky" x="14" y="42" width="52" height="18" rx="9"/><circle class="mark-sky" cx="80" cy="20" r="11"/></svg>
    <h1>开始一份医学写作</h1>
    <p class="welcome-sub">文档和幻灯片都能直接编辑；也可以让 Heurion 起草、改写、检索文献、核对论断，引用自动规范。</p>
    <div class="welcome-cards">
