# Heurion Execution Plane — Node.js worker for document rendering + plugin execution.
#
# Runs on a separate VPS from the TypeScript Control Plane.
# Jobs are submitted via HTTP only (#444: the Redis queue was a dead path —
# no producer ever wrote to it; both consumers were removed).

services:
  heurion-worker:
    # #801 P0: 日志轮转(同 docker-compose.yml — json-file 无上限打爆磁盘)。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
        tag: "{{.Name}}"
    # #1150: 禁止浮动 :latest 默认 — 未显式给 tag 时 compose 解析即失败，
    # 部署脚本（deploy-worker.yml）始终传 sha。
    image: ghcr.io/0xaicrypto/heurion-worker:${WORKER_IMAGE_TAG:?WORKER_IMAGE_TAG required}
    build:
      # Dockerfile 以 repo 根为 context（contracts file: 依赖需要整仓可见），
      # 见 packages/worker/Dockerfile 头注释。worker VPS 走 image pull，
      # 此 build 段仅在 repo checkout 内手动 --build 时生效。
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: heurion-worker
    # #1150: 内存上限（puppeteer/soffice 峰值高，但失控时封顶）。
    mem_limit: 6g
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-}
      # #795: job store + rendered files must live on the mounted volume,
      # not the container layer (a rebuild would otherwise lose everything).
      - WORKER_DATA_DIR=/data
      # #793: expose the server.ts tunables instead of baking them into the
      # (CI-overwritten) compose file.
      - WORKER_MAX_CONCURRENT=${WORKER_MAX_CONCURRENT:-}
      - WORKER_BODY_LIMIT=${WORKER_BODY_LIMIT:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      # #1058: 相对路径图片 ref（/api/v1/files/download/...）导出嵌入的基址 —
      # 填 Control Plane 的对外地址（如 https://api.example.com）；未配置时
      # 相对路径图片导出会被跳过并留 [REMOTE-IMAGE] 日志。BACKEND_URL 为兼容别名。
      - SERVER_ORIGIN=${SERVER_ORIGIN:-}
      - BACKEND_URL=${BACKEND_URL:-}
      # #1066-8: 单次导出内嵌图片总字节预算（base64 峰值 ~1.37x），默认 100MB。
      - PPTX_IMAGE_BUDGET_BYTES=${PPTX_IMAGE_BUDGET_BYTES:-}
    volumes:
      - worker-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  worker-data:
