# Heurion Execution Plane — Node.js worker for document rendering + plugin execution.
#
# Runs on a separate VPS from the TypeScript Control Plane.
# Jobs are submitted via HTTP only (#444: the Redis queue was a dead path —
# no producer ever wrote to it; both consumers were removed).

services:
  heurion-worker:
    image: ghcr.io/0xaicrypto/heurion-worker:${WORKER_IMAGE_TAG:-latest}
    build:
      # Dockerfile 以 repo 根为 context（contracts file: 依赖需要整仓可见），
      # 见 packages/worker/Dockerfile 头注释。worker VPS 走 image pull，
      # 此 build 段仅在 repo checkout 内手动 --build 时生效。
      context: .
      dockerfile: packages/worker/Dockerfile
    container_name: heurion-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-}
      # #795: job store + rendered files must live on the mounted volume,
      # not the container layer (a rebuild would otherwise lose everything).
      - WORKER_DATA_DIR=/data
      # #793: expose the server.ts tunables instead of baking them into the
      # (CI-overwritten) compose file.
      - WORKER_MAX_CONCURRENT=${WORKER_MAX_CONCURRENT:-}
      - WORKER_BODY_LIMIT=${WORKER_BODY_LIMIT:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - worker-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  worker-data:
