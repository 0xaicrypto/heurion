# Heurion Execution Plane — Node.js worker for document rendering + plugin execution.
#
# Runs on a separate VPS from the TypeScript Control Plane.
# Jobs are submitted via HTTP only (#444: the Redis queue was a dead path —
# no producer ever wrote to it; both consumers were removed).

services:
  heurion-worker:
    image: ghcr.io/0xaicrypto/heurion-worker:${WORKER_IMAGE_TAG:-latest}
    build:
      context: packages/worker
      dockerfile: Dockerfile
    container_name: heurion-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - worker-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  worker-data:
