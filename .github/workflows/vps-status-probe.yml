# 一次性/诊断探针 — 只读，长期不用可删。
# 用途：手动触发，SSH 到 VPS 查看负载/内存/OOM/容器重启/关键容器近期日志，
# 定位「服务中断」类问题（不改任何状态）。
name: VPS Status Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Probe VPS status (read-only)
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '=== uptime/load ==='; uptime;
            echo '=== memory ==='; free -h;
            echo '=== disk ==='; df -h / | tail -1;
            echo '=== containers ==='; sudo docker ps --format '{{.Names}}\t{{.Status}}';
            echo '=== restart counts / startedAt ===';
            for c in \$(sudo docker ps -q); do sudo docker inspect -f '{{.Name}} restarts={{.RestartCount}} started={{.State.StartedAt}} status={{.State.Status}}' \$c; done;
            echo '=== docker stats (snapshot) ==='; sudo docker stats --no-stream --format '{{.Name}}\tCPU={{.CPUPerc}}\tMEM={{.MemUsage}}';
            echo '=== OOM / kills (last 24h) ==='; sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process' | tail -8 || echo '(dmesg unavailable)';
            echo '=== nexus-server last 20 log lines ==='; sudo docker logs --tail 20 nexus-server 2>&1 | tail -20;
            echo '=== embedding-server last 15 log lines ==='; sudo docker logs --tail 15 nexus-embedding-server 2>&1 | tail -15;
            echo '=== staging containers (if any) ==='; sudo docker ps --filter name=staging --format '{{.Names}}\t{{.Status}}' || true;
            echo '=== active pull/download processes ===';
            sudo ps -eo pid,etime,cmd 2>/dev/null | grep -E 'docker (compose )?pull|docker-untar|containerd' | grep -v grep | head -8 || true;
            echo '=== image store recent activity ===';
            sudo docker system df 2>/dev/null | head -5 || true;
          "
