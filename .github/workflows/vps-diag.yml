name: VPS diag (temp)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Diagnose server
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            echo "===== TOP CPU ====="
            top -bn1 | head -18
            echo "===== NODE/PROC ====="
            ps aux --sort=-%cpu | head -12
            echo "===== DOCKER PS ====="
            sudo docker ps --format "{{.Names}} {{.Status}} {{.Ports}}" 2>/dev/null
            echo "===== SERVER CONTAINER CPU/MEM ====="
            sudo docker stats --no-stream --format "{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}" 2>/dev/null
            echo "===== SERVER LOGS (last 30) ====="
            sudo docker logs nexus-server --tail 30 2>&1 | tail -30
            echo "===== EVENT LOOP / GC ====="
            sudo docker exec nexus-server sh -c "node -e '\''const t=Date.now(); setTimeout(()=>{const d=Date.now()-t; console.log("event-loop-latency-ms:", d)}, 1000)'\''" 2>&1 | tail -2 || true
          ' 2>&1 | tail -120