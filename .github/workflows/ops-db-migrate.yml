name: Ops DB Migrate (add missing columns, non-destructive)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect = 只诊断;apply = 幂等加列'
        required: true
        default: 'inspect'
        type: choice
        options: [inspect, apply]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Inspect — schema sync 日志 + docs 列清单 + 接口状态
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '=== schema sync 日志(失败原因留痕) ===';
            cd /opt/heurion && docker compose --env-file .env.production logs nexus-server 2>/dev/null | grep -iE 'Schema sync|db push|[Dd]eploying' | tail -5 || true;
            echo '=== docs 列(node:sqlite 直查) ===';
            docker compose --env-file .env.production exec -T -u root nexus-server node --experimental-sqlite -e \"const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/data/db/nexus_server.db');console.log(db.prepare(\\\"SELECT name FROM pragma_table_info('docs')\\\").all().map(r=>r.name).join(','))\" 2>/dev/null || true;
            echo '=== 接口状态(401=鉴权挡住属正常;500=Prisma 层炸) ===';
            curl -sS -o /dev/null -w 'healthz %{http_code}\n' https://heurion.org/healthz;
            curl -sS -o /dev/null -w 'docs %{http_code}\n' https://heurion.org/api/v1/docs
          "
      - name: Apply — 幂等加列(docs.block_projection)
        if: ${{ inputs.action == 'apply' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/heurion
            HAS=\$(docker compose --env-file .env.production exec -T -u root nexus-server node --experimental-sqlite -e \"const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/data/db/nexus_server.db');const names=db.prepare(\\\"SELECT name FROM pragma_table_info('docs')\\\").all().map(r=>r.name).join(',');console.log(names.includes('block_projection')?1:0)\" 2>/dev/null || echo 0)
            echo \"HAS=\$HAS\"
            if [ \"\$HAS\" = '1' ]; then
              echo 'column already present — skip';
            else
              docker compose --env-file .env.production exec -T -u root nexus-server node --experimental-sqlite -e \"const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/data/db/nexus_server.db');db.exec('ALTER TABLE docs ADD COLUMN block_projection TEXT;');console.log('ALTER applied')\" 2>/dev/null
            fi
            echo '=== docs 列(确认) ===';
            docker compose --env-file .env.production exec -T -u root nexus-server node --experimental-sqlite -e \"const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/data/db/nexus_server.db');console.log(db.prepare(\\\"SELECT name FROM pragma_table_info('docs')\\\").all().map(r=>r.name).join(','))\" 2>/dev/null || true
          "
      - name: Verify — docs 接口不再炸
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            curl -sS -o /dev/null -w 'healthz %{http_code}\n' https://heurion.org/healthz;
            curl -sS -o /dev/null -w 'docs %{http_code}\n' https://heurion.org/api/v1/docs
          "
