# #989 部署事故运维通道 — 生产 DB schema 手术（非破坏,只加列,幂等可重跑）。
# 背景:syncSchema 的非破坏 db push 在生产库有漂移时拒绝执行（main.ts 只
# log.warn 非致命）→ 新列缺失 → docs 接口 Prisma P2022。本通道显式执行
# 幂等 ALTER TABLE ADD COLUMN,并留痕 schema sync 失败原因（根因诊断）。
# 归档建议见 .github/workflows/README.md（#924 家族）。
name: Ops DB Migrate (add missing columns, non-destructive)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect = 只诊断;apply = 幂等加列'
        required: true
        default: 'inspect'
        type: choice
        options: [inspect, apply]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Inspect — schema sync 日志 + docs 列清单 + 接口状态
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '=== schema sync 日志(失败原因留痕) ===';
            cd /opt/heurion && docker compose --env-file .env.production logs nexus-server 2>/dev/null | grep -iE 'Schema sync|db push|[Dd]eploying' | tail -8 || true;
            echo '=== docs 列 ===';
            echo \"SELECT name FROM pragma_table_info('docs');\" | docker compose --env-file .env.production exec -T nexus-server npx prisma db execute --schema prisma/schema.prisma --stdin;
            echo '=== 接口状态(401=鉴权挡住属正常;500=Prisma 层炸) ===';
            curl -sS -o /dev/null -w 'healthz %{http_code}\n' https://heurion.org/healthz;
            curl -sS -o /dev/null -w 'docs %{http_code}\n' https://heurion.org/api/v1/docs
          "
      - name: Apply — 幂等加列(docs.block_projection)
        if: ${{ inputs.action == 'apply' }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/heurion
            HAS=\$(echo \"SELECT name FROM pragma_table_info('docs');\" | docker compose --env-file .env.production exec -T nexus-server npx prisma db execute --schema prisma/schema.prisma --stdin | grep -c block_projection || true)
            if [ \"\$HAS\" -gt 0 ]; then
              echo 'column already present — skip';
            else
              echo 'ALTER TABLE docs ADD COLUMN block_projection TEXT;' | docker compose --env-file .env.production exec -T nexus-server npx prisma db execute --schema prisma/schema.prisma --stdin
              echo 'ALTER applied';
            fi
            echo '=== docs 列(确认) ===';
            echo \"SELECT name FROM pragma_table_info('docs');\" | docker compose --env-file .env.production exec -T nexus-server npx prisma db execute --schema prisma/schema.prisma --stdin
          "
      - name: Verify — docs 接口不再炸
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            curl -sS -o /dev/null -w 'healthz %{http_code}\n' https://heurion.org/healthz;
            curl -sS -o /dev/null -w 'docs %{http_code}\n' https://heurion.org/api/v1/docs
          "
