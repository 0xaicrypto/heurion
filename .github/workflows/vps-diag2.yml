name: VPS diag2 (temp)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Diagnose processes
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            echo "===== ALL node/python processes (full cmdline + mem) ====="
            ps -eo pid,rss,pcpu,etime,args --sort=-rss | grep -E "node|python|tsx|main.ts" | grep -v grep | head -20
            echo "===== LISTENING PORTS ====="
            sudo ss -ltnp 2>/dev/null | grep -E ":8001|:8002|:8003|:8004|:8005" | head -12
            echo "===== PM2 LIST ====="
            pm2 list 2>/dev/null | head -15 || sudo -u root pm2 list 2>/dev/null | head -15 || echo "pm2 not in path"
            echo "===== MEMORY ====="
            free -m
            echo "===== DOCKER INSPECT (is host process inside container?) ====="
            for pid in $(ps -eo pid,args | grep "dist/index.js" | grep -v grep | awk "{print \$1}" | head -5); do
              echo "pid=$pid cgroup=$(cat /proc/$pid/cgroup 2>/dev/null | tr "\n" " ") cmd=$(tr "\0" " " < /proc/$pid/cmdline 2>/dev/null | head -c 160)"
            done
          ' 2>&1 | tail -80