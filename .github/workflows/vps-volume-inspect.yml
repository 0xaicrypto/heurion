name: VPS Volume Inspect (one-off)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Inspect volumes and data layout
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            echo "=== compose services ===";
            docker compose -f /opt/heurion/docker-compose.yml config --services 2>/dev/null || true;
            echo "=== volumes ===";
            docker volume ls;
            echo "=== nexus-data mount ===";
            docker volume inspect $(docker volume ls -q | grep nexus) 2>/dev/null | grep -E "Name|Mountpoint" | head -6;
            echo "=== db-data volume contents ===";
            sudo ls -la /var/lib/docker/volumes/heurion_nexus-db-data/_data/ 2>/dev/null | head -10;
            echo "=== nexus-data volume contents ===";
            sudo ls -la /var/lib/docker/volumes/heurion_nexus-data/_data/ 2>/dev/null | head -14;
            echo "=== files-data volume contents ===";
            sudo ls -la /var/lib/docker/volumes/heurion_nexus-files-data/_data/ 2>/dev/null | head -10;
            echo "=== sample user dir in files volume ===";
            sudo ls /var/lib/docker/volumes/heurion_nexus-files-data/_data/$(sudo ls /var/lib/docker/volumes/heurion_nexus-files-data/_data/ 2>/dev/null | head -1)/ 2>/dev/null | head -10;
            echo "=== a user dir sample ===";
            sudo ls /var/lib/docker/volumes/heurion_nexus-data/_data/user_xl5ac9ty0s/ 2>/dev/null | head -8;
            echo "=== deployed version ===";
            grep -oE '"[a-f0-9]{7}"' /opt/heurion/.env.production 2>/dev/null | head -1 || docker ps --format '{{.Image}}' | grep nexus-server | head -1;
            echo "=== recent verification logs ===";
            sudo journalctl -u docker --no-pager -n 200 2>/dev/null | grep -iE "verification code|Resend failed|bind-email" | tail -8 || true;
            sudo ls -t /opt/heurion/logs 2>/dev/null | head -3 || true;
            docker logs nexus-server --tail 100 2>&1 | grep -iE "verification code|resend|bind" | tail -8 || true;
            echo "=== port 8002 owner ===";
            sudo ss -ltnp | grep ':8002' || true;
            sudo fuser 8002/tcp 2>/dev/null || true;
            echo "=== staging LLM errors ===";
            sudo tail -100 /root/.pm2/logs/heurion-staging-error.log 2>/dev/null | grep -iE "error|401|invalid|fail" | tail -6 || tail -100 ~/.pm2/logs/heurion-staging-error.log 2>/dev/null | grep -iE "error|401|invalid|fail" | tail -6 || true;
            echo "=== staging out log (chat) ===";
            sudo tail -200 /root/.pm2/logs/heurion-staging-out.log 2>/dev/null | grep -iE "chat|stream|turn|llm|deepseek|token" | tail -10 || tail -200 ~/.pm2/logs/heurion-staging-out.log 2>/dev/null | grep -iE "chat|stream|turn|llm|deepseek|token" | tail -10 || true;
            echo "=== live chat probe ===";
            printf '%s' '{"username":"HZ","password":"hz123456","display_name":"Test"}' > /tmp/reg.json;
            REG=$(curl -s -X POST http://localhost:8002/api/v1/auth/register -H 'Content-Type: application/json' --data-binary @/tmp/reg.json);
            TOKEN=$(echo "$REG" | grep -oE 'eyJ[A-Za-z0-9._-]+' | head -1);
            echo "register: $(echo "$REG" | head -c 100)";
            echo "token: ${TOKEN:0:12}...";
            printf '%s' '{"text":"ping","patient_hash":"__probe__"}' > /tmp/chat.json;
            curl -sN -m 60 -X POST http://localhost:8002/api/v1/agent/chat -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/chat.json 2>/dev/null | head -c 700;
            echo;
            echo "=== staging env ===";
            grep -E "DEFAULT_LLM_PROVIDER|DEFAULT_LLM_MODEL|OPENCODE_API_KEY" /root/heurion/packages/server-ts/.env 2>/dev/null || grep -E "DEFAULT_LLM_PROVIDER|DEFAULT_LLM_MODEL|OPENCODE_API_KEY" ~/heurion/packages/server-ts/.env 2>/dev/null | sed 's/OPENCODE_API_KEY=.*/OPENCODE_API_KEY=***/' || true;
            echo "=== df ===";
            df -h / | tail -1
          '
