# Server TS CI — ensures the TypeScript backend builds and Phase 0 tests pass.
#
# Runs on PRs and pushes to main that touch packages/server-ts, packages/server,
# deploy scripts, or this workflow.
# Phase 0 covers the Brain 2.0 ingestion pipeline and AI infrastructure:
#   medical-record-entry, approval-audit, ingestion-worker, lab-ingestion, imaging-ingestion,
#   ai-provider, protocol-ingestion, local-embedding
#
# Deployment remains in deploy-server.yml.

name: Server TS CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/server-ts/**'
      - 'packages/embedding-server/**'
      - 'packages/worker/**'
      - '.github/workflows/server-ts-ci.yml'
      - '.github/workflows/deploy-server.yml'
      - 'CONTRIBUTING.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/deploy*.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.env.production.example'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: 'file:./ci.db'

jobs:
  unit-tests:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: packages/server-ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts (drift guard)
        run: cd ../contracts && pnpm install --frozen-lockfile && pnpm build

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Prepare SQLite database
        run: pnpm exec prisma db push --accept-data-loss --skip-generate

      - name: Run unit tests (tests/unit, no DB/IO)
        # timeout guards against runner-level hangs (observed: job stuck at
        # 15m while the same suite runs in ~10s locally) — fails loudly.
        run: timeout 240 pnpm exec vitest run tests/unit tests/integration --testTimeout=20000

  build-and-test:
    name: Build + Phase 0 regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: packages/server-ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts (drift guard)
        run: cd ../contracts && pnpm install --frozen-lockfile && pnpm build

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Prepare SQLite database
        run: pnpm exec prisma db push --accept-data-loss --skip-generate

      - name: TypeScript build
        run: pnpm run build

      - name: Run regression tests
        # Phase 0 + architecture-optimization suites (#436-#461): LLM
        # gateway, stats engine, plugin lifecycle, sidecar content
        # guarantee, chart tokens, router classification.
        run: |
          pnpm exec vitest run \
            tests/e2e/medical-record-entry.test.ts \
            tests/e2e/approval-audit.test.ts \
            tests/e2e/ingestion-worker.test.ts \
            tests/e2e/lab-ingestion.test.ts \
            tests/e2e/imaging-ingestion.test.ts \
            tests/unit/ai-provider.test.ts \
            tests/e2e/protocol-ingestion.test.ts \
            tests/unit/local-embedding.test.ts \
            tests/unit/provider-runtime.test.ts \
            tests/unit/stats-engine.test.ts \
            tests/unit/bioscene.test.ts \
            tests/unit/context-budget.test.ts \
            tests/unit/episode-isolation.test.ts \
            tests/unit/llm-telemetry.test.ts \
            tests/e2e/plugin.test.ts \
            tests/e2e/sidecar-content.test.ts \
            tests/e2e/sidecar-metadata.test.ts \
            tests/e2e/chart-download.test.ts \
            tests/e2e/render-chart.test.ts \
            tests/integration/sidecar-chat-context.test.ts \
            tests/unit/query-router.test.ts
