# Server TS CI — ensures the TypeScript backend builds and Phase 0 tests pass.
#
# Runs on PRs and pushes to main that touch packages/server-ts, packages/server,
# deploy scripts, or this workflow.
# Phase 0 covers the Brain 2.0 ingestion pipeline and AI infrastructure:
#   medical-record-entry, approval-audit, ingestion-worker, lab-ingestion, imaging-ingestion,
#   ai-provider, protocol-ingestion, local-embedding
#
# Deployment remains in deploy-server.yml.

name: Server TS CI

on:
  pull_request:
    paths:
      - 'packages/server-ts/**'
      - 'packages/server/**'
      - '.github/workflows/server-ts-ci.yml'
      - '.github/workflows/deploy-server.yml'
      - 'scripts/deploy*.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.env.production.example'
  push:
    branches: [main]
    paths:
      - 'packages/server-ts/**'
      - 'packages/server/**'
      - '.github/workflows/server-ts-ci.yml'
      - '.github/workflows/deploy-server.yml'
      - 'scripts/deploy*.sh'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.env.production.example'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: 'file:./ci.db'

jobs:
  build-and-test:
    name: Build + Phase 0 regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: packages/server-ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Prepare SQLite database
        run: pnpm exec prisma db push --accept-data-loss --skip-generate

      - name: TypeScript build
        run: pnpm run build

      - name: Run Phase 0 regression tests
        run: |
          pnpm exec vitest run \
            tests/medical-record-entry.test.ts \
            tests/approval-audit.test.ts \
            tests/ingestion-worker.test.ts \
            tests/lab-ingestion.test.ts \
            tests/imaging-ingestion.test.ts \
            tests/ai-provider.test.ts \
            tests/protocol-ingestion.test.ts \
            tests/local-embedding.test.ts
