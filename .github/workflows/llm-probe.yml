name: LLM probe (temp)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Raw OpenAI format
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          curl -s --max-time 120 -X POST https://opencode.ai/zen/go/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Call the ping tool and report the result."}],"tools":[{"type":"function","function":{"name":"ping","description":"test tool","parameters":{"type":"object","properties":{}}}}]}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); m=r['choices'][0]['message']; print('tool_calls:', json.dumps(m.get('tool_calls'))[:300]); print('finish:', r['choices'][0].get('finish_reason'))"
      - name: AI SDK 6 generateText
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe && npm init -y >/dev/null 2>&1 && npm i ai@6.0.246 @ai-sdk/openai@3.0.91 zod >/dev/null 2>&1
          cp /home/runner/work/heurion/heurion/scripts/probe-llm.mjs ./probe-llm.mjs
          KEY=$KEY node ./probe-llm.mjs 2>&1 | head -12
