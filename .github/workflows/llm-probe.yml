# 一次性/诊断探针 — 长期不用可删（#924 归档标记）
# 用途：手动触发(workflow_dispatch)，对 LLM 供应商做 tool-call 兼容性 sweep（scripts/probe-llm.mjs）。
# 归档建议见 .github/workflows/README.md
name: LLM probe (temp)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Model tool-call sweep
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe && npm init -y >/dev/null 2>&1 && npm i ai@6.0.246 @ai-sdk/openai@3.0.91 zod >/dev/null 2>&1
          cp /home/runner/work/heurion/heurion/scripts/probe-llm.mjs ./probe-llm.mjs
          KEY=$KEY node ./probe-llm.mjs 2>&1 | head -20
