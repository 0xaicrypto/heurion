name: LLM probe (temp)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe gateway tool support
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          echo "== models: deepseek-v4-flash? =="
          curl -s https://opencode.ai/zen/go/v1/models -H "Authorization: Bearer $KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print([m['id'] for m in d['data']])" 2>&1 | head -3
          echo "== tool call test =="
          curl -s --max-time 120 -X POST https://opencode.ai/zen/go/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"Call the ping tool and report the result."}],"tools":[{"type":"function","function":{"name":"ping","description":"test tool","parameters":{"type":"object","properties":{}}}}]}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); m=r['choices'][0]['message']; print('tool_calls:', json.dumps(m.get('tool_calls'))[:400]); print('content:', (m.get('content') or '')[:200]); print('finish:', r['choices'][0].get('finish_reason'))" 2>&1 | head -8
