# Build Base Image — weekly refresh + on changes to Dockerfile.base.
#
# The base image (Python 3.11 + Node 22 + uv) is consumed by the
# main deploy-server.yml workflow.  Rebuilding it weekly ensures
# security patches are picked up without waiting for a code push.

name: Build Base Image

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.base'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ghcr.io/0xaicrypto/nexus-base

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: ${{ env.BASE_IMAGE_NAME }}:py3.11
          cache-from: type=gha
          cache-to: type=gha,mode=max
