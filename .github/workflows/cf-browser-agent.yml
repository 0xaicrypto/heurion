name: CF Browser Agent CI

on:
  pull_request:
    paths:
      - 'packages/cf-browser-agent/**'
      - '.github/workflows/cf-browser-agent.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cf-browser-agent/**'
      - '.github/workflows/cf-browser-agent.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test (mocked browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cf-browser-agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/cf-browser-agent/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm test

  deploy:
    name: Deploy (wrangler)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/cf-browser-agent/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: packages/cf-browser-agent
      # #485: the browser binding is only validated at deploy time — if the
      # account hasn't enabled Browser Run, this step fails with the binding
      # error and we know the account needs the service enabled.
      - name: Register workers.dev subdomain (idempotent)
        working-directory: packages/cf-browser-agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler subdomain heurion-browser-agent || true
      - name: Deploy worker
        working-directory: packages/cf-browser-agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler secret put WRB_TASK_TOKEN --name heurion-browser-agent <<< "${{ secrets.WRB_TASK_TOKEN }}" 2>&1 | tail -1 || true
          npx wrangler deploy --name heurion-browser-agent 2>&1 | tee /tmp/wr.log
          grep -oE 'https://[a-z0-9-]+\.workers\.dev[^ ]*' /tmp/wr.log | head -1
      - name: Smoke check
        env:
          WRB_TOKEN: ${{ secrets.WRB_TASK_TOKEN }}
        run: |
          URL="$(grep -oE 'https://heurion-browser-agent\.[a-z0-9-]+\.workers\.dev' /tmp/wr.log | head -1)"
          echo "smoke URL: $URL"
          curl -s "$URL/healthz"
          echo
          curl -s -X POST "$URL/browser-task" -H "content-type: application/json" -d '{"instruction":"x"}' | head -c 120
          echo
          curl -s -X POST "$URL/browser-task" -H "content-type: application/json" -H "x-worker-token: $WRB_TOKEN" -d '{"instruction":"访问 heurion.org 首页并描述内容"}' --max-time 120 | head -c 400
