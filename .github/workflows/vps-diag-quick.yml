name: VPS diag quick (temp)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Diagnose
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            echo "===== DOCKER PS ====="
            sudo docker ps -a --format "{{.Names}} {{.Status}} {{.Ports}}"
            echo "===== MEM ====="
            free -m | head -2
            echo "===== NODE PROCS ====="
            ps -eo pid,rss,pcpu,etime,args --sort=-rss | grep -E "node|python" | grep -v grep | head -12
            echo "===== SERVER LOGS (last 40) ====="
            sudo docker logs nexus-server --tail 40 2>&1 | tail -40
            echo "===== CADDY → SERVER probe ====="
            sudo docker exec nexus-caddy sh -c "wget -qO- http://nexus-server:8001/healthz 2>&1 | head -c 200" 2>&1 || echo "caddy probe failed"
            echo "===== SERVER container port 8001 listen? ====="
            sudo docker exec nexus-server sh -c "ss -ltn 2>/dev/null | head -5" 2>&1 || echo "cannot ss in server container"
          ' 2>&1 | tail -90
