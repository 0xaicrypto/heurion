name: Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy+regression at a time: staging is a single shared VPS, and
# concurrent deploys reset the DB while the other run is mid-regression.
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE_NAME: ghcr.io/0xaicrypto/nexus-server
  EMBEDDING_IMAGE_NAME: ghcr.io/0xaicrypto/nexus-embedding-server
  STATS_IMAGE_NAME: ghcr.io/0xaicrypto/nexus-stats-worker

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - run: cd packages/server-ts && pnpm install --frozen-lockfile && npx prisma generate && npx tsc --noEmit

  test:
    name: Unit Tests
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - name: Run Phase 0 regression tests
        run: |
          cd packages/server-ts
          pnpm install --frozen-lockfile
          npx prisma generate
          pnpm exec vitest run \
            tests/e2e/medical-record-entry.test.ts \
            tests/e2e/approval-audit.test.ts \
            tests/e2e/ingestion-worker.test.ts \
            tests/e2e/lab-ingestion.test.ts \
            tests/e2e/imaging-ingestion.test.ts \
            tests/unit/ai-provider.test.ts \
            tests/e2e/protocol-ingestion.test.ts \
            tests/unit/local-embedding.test.ts

  build-web:
    name: Build Web Dist
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: cd packages/web && pnpm install --frozen-lockfile && pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 1

  build-server-image:
    name: Build Server Image
    needs: [test, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server-ts/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.SERVER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-embedding-server-image:
    name: Build Embedding Server Image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push embedding server image
        uses: docker/build-push-action@v6
        with:
          context: packages/embedding-server
          file: packages/embedding-server/Dockerfile
          push: true
          tags: |
            ${{ env.EMBEDDING_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.EMBEDDING_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  golden-crosscheck:
    name: Golden stats cross-check
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python reference values
        run: |
          pip install -q scipy lifelines statsmodels numpy
          cd packages/python-stats-worker
          python generate_golden.py > golden/stats_golden.json
          git diff --exit-code golden/stats_golden.json || { echo "golden drift — regenerate and commit"; exit 1; }
      - name: TS cross-check
        run: |
          cd packages/server-ts
          pnpm install --frozen-lockfile
          node --import tsx scripts/cross-check-stats.ts ../python-stats-worker/golden/stats_golden.json

  build-stats-worker:
    name: Build Python Stats Worker Image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push stats worker image
        uses: docker/build-push-action@v6
        with:
          context: packages/python-stats-worker
          file: packages/python-stats-worker/Dockerfile
          push: true
          tags: |
            ${{ env.STATS_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.STATS_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Staging + Regression
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy staging + regression
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          scp -o StrictHostKeyChecking=no scripts/deploy-staging.sh scripts/regression-test.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/heurion/scripts/
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ~/heurion && DEEPSEEK_KEY=$DEEPSEEK_KEY GEMINI_KEY=$GEMINI_KEY OPENCODE_KEY=$OPENCODE_KEY bash scripts/deploy-staging.sh && bash scripts/regression-test.sh http://localhost:8002; echo '' | base64 -d > /tmp/probe-staging.sh && bash /tmp/probe-staging.sh || true"

  cloudflare-ssl:
    name: Cloudflare SSL
    needs: [staging]
    runs-on: ubuntu-latest
    steps:
      - name: Set Cloudflare SSL to Full
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$ZONE_ID" ]; then exit 0; fi
          CURRENT=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" -H "Authorization: Bearer $CF_TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.result.value)}catch(e){console.log('')}})" 2>/dev/null)
          if [ "$CURRENT" != "full" ] && [ "$CURRENT" != "strict" ]; then
            curl -sS -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"full"}'
          fi

  deploy:
    name: Deploy to Production (Docker Compose)
    needs: [staging, cloudflare-ssl, build-server-image, build-web, build-embedding-server-image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://heurion.org
    steps:
      - uses: actions/checkout@v4

      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Write production env
        env:
          HOSTNAME: heurion.org
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          EXECUTION_PLANE_URL: ${{ secrets.EXECUTION_PLANE_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cat > /tmp/heurion-deploy.env <<EOF
          HOSTNAME=${HOSTNAME}
          SERVER_HOST=0.0.0.0
          SERVER_PORT=8001
          ENVIRONMENT=production
          LOG_LEVEL=INFO
          SERVER_SECRET=${SERVER_SECRET}
          CORS_ALLOW_ORIGINS=https://${HOSTNAME}
          DEFAULT_LLM_PROVIDER=opencode
          DEFAULT_LLM_MODEL=deepseek-v4-flash
          OPENCODE_API_KEY=${OPENCODE_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          # #283: email verification delivery (Resend) — falls back to
          # console logging in dev when unset.
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=Heurion <no-reply@heurion.org>
          EXECUTION_PLANE_URL=${EXECUTION_PLANE_URL}
          WORKER_API_TOKEN=${WORKER_API_TOKEN}
          CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
          CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
          EMBEDDING_PROVIDER=local
          EMBEDDING_MODEL=Xenova/bge-small-en-v1.5
          EMBEDDING_BATCH_SIZE=32
          EMBEDDING_FALLBACK_PROVIDER=none
          LOCAL_EMBEDDING_URL=http://nexus-embedding-server:8003/embed
          OPENAI_EMBEDDING_MODEL=text-embedding-3-small
          EOF

      - name: Free disk space on VPS (stale images, builder caches, logs)
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "            docker system prune -af 2>/dev/null || true;             docker builder prune -af 2>/dev/null || true;             journalctl --vacuum-size=100M 2>/dev/null || true;             find /var/log -name '*.gz' -delete 2>/dev/null || true;             rm -rf /tmp/* /var/tmp/* 2>/dev/null || true;             df -h / | tail -1"

      - name: Deploy production via Docker Compose
        env:
          NEXUS_IMAGE: ${{ env.SERVER_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          EMBEDDING_IMAGE: ${{ env.EMBEDDING_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          STATS_IMAGE: ${{ env.STATS_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/heurion/packages/web/dist /opt/heurion/scripts && rm -rf /opt/heurion/packages/web/dist/assets"
          scp -o StrictHostKeyChecking=no -r packages/web/dist/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/packages/web/dist/
          scp -o StrictHostKeyChecking=no /tmp/heurion-deploy.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/.env.production
          scp -o StrictHostKeyChecking=no docker-compose.yml Caddyfile ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/
          scp -o StrictHostKeyChecking=no scripts/deploy-production-compose.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/scripts/
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/heurion && chmod +x scripts/deploy-production-compose.sh && NEXUS_IMAGE=$NEXUS_IMAGE EMBEDDING_IMAGE=$EMBEDDING_IMAGE STATS_IMAGE=$STATS_IMAGE bash scripts/deploy-production-compose.sh"

      - name: Purge Cloudflare cache (stale HTML references removed bundles)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$ZONE_ID" ]; then echo "no CF creds, skipping purge"; exit 0; fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.success?'CF cache purged':('purge failed: '+JSON.stringify(j.errors))) }catch(e){console.log('purge response unparsable')}})"

