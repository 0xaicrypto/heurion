name: Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy+regression at a time: staging is a single shared VPS, and
# concurrent deploys reset the DB while the other run is mid-regression.
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE_NAME: ghcr.io/0xaicrypto/nexus-server
  EMBEDDING_IMAGE_NAME: ghcr.io/0xaicrypto/nexus-embedding-server
  STATS_IMAGE_NAME: ghcr.io/0xaicrypto/nexus-stats-worker

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - run: cd packages/server-ts && pnpm install --frozen-lockfile && cd ../contracts && pnpm install --frozen-lockfile && pnpm build && cd ../server-ts && npx prisma generate && npx tsc --noEmit

  test:
    name: Unit Tests
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - name: Run regression tests
        run: |
          cd packages/server-ts
          pnpm install --frozen-lockfile
          cd ../contracts && pnpm install --frozen-lockfile && pnpm build && cd ../server-ts
          npx prisma generate
          pnpm exec vitest run \
            tests/e2e/medical-record-entry.test.ts \
            tests/e2e/approval-audit.test.ts \
            tests/e2e/ingestion-worker.test.ts \
            tests/e2e/lab-ingestion.test.ts \
            tests/e2e/imaging-ingestion.test.ts \
            tests/unit/ai-provider.test.ts \
            tests/e2e/protocol-ingestion.test.ts \
            tests/unit/local-embedding.test.ts \
            tests/unit/provider-runtime.test.ts \
            tests/unit/stats-engine.test.ts \
            tests/e2e/plugin.test.ts \
            tests/e2e/sidecar-content.test.ts \
            tests/e2e/chart-download.test.ts \
            tests/integration/sidecar-chat-context.test.ts

  build-web:
    name: Build Web Dist
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: cd packages/web && pnpm install --frozen-lockfile && pnpm build
      # #545: docs 构建与部署解耦 — 文档站故障只产生告警,不阻塞主应用
      # 发布(web-dist 照常产出,仅不含 /docs)。
      - name: Build docs site
        run: |
          cd packages/docs-site
          if ! pnpm install --frozen-lockfile; then
            echo "::error::docs-site install failed — shipping without /docs"
            exit 0
          fi
          if ! pnpm build; then
            echo "::error::docs-site build failed — shipping without /docs"
            exit 0
          fi
          mkdir -p ../web/dist/docs
          cp -r docs/.vitepress/dist/* ../web/dist/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 1

  build-server-image:
    name: Build Server Image
    needs: [test, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server-ts/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.SERVER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-embedding-server-image:
    name: Build Embedding Server Image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push embedding server image
        uses: docker/build-push-action@v6
        with:
          context: packages/embedding-server
          file: packages/embedding-server/Dockerfile
          push: true
          tags: |
            ${{ env.EMBEDDING_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.EMBEDDING_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  golden-crosscheck:
    name: Golden stats cross-check
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python reference values
        run: |
          pip install -q scipy lifelines statsmodels numpy
          cd packages/python-stats-worker
          python generate_golden.py > golden/stats_golden.json
          git diff --exit-code golden/stats_golden.json || { echo "golden drift — regenerate and commit"; exit 1; }
      - name: TS cross-check
        run: |
          cd packages/server-ts
          pnpm install --frozen-lockfile
          node --import tsx scripts/cross-check-stats.ts ../python-stats-worker/golden/stats_golden.json

  build-stats-worker:
    name: Build Python Stats Worker Image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push stats worker image
        uses: docker/build-push-action@v6
        with:
          context: packages/python-stats-worker
          file: packages/python-stats-worker/Dockerfile
          push: true
          tags: |
            ${{ env.STATS_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.STATS_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Staging + Regression
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy staging + regression
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          scp -o StrictHostKeyChecking=no scripts/deploy-staging.sh scripts/regression-test.sh scripts/probe-staging.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/heurion/scripts/
          # #553: 去掉 || true — staging 部署或回归失败必须失败本 job,
          # 否则生产门禁形同虚设(probe 仅诊断,单独以 ; 分隔)。
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ~/heurion && DEEPSEEK_KEY=$DEEPSEEK_KEY GEMINI_KEY=$GEMINI_KEY OPENCODE_KEY=$OPENCODE_KEY bash scripts/deploy-staging.sh && bash scripts/regression-test.sh http://localhost:8002; bash scripts/probe-staging.sh""


  provision-reactome-diagrams:
    name: Provision Reactome Diagrams
    # #466: ship the full Reactome pathway diagram library (CC BY 4.0) to
    # the production server — the server reads them from
    # REACTOME_DIAGRAMS_DIR (no runtime network dependency).
    #
    # Non-blocking by design: Reactome is an EXTERNAL resource — its
    # download failing must never block the core production deploy
    # (render_scene degrades gracefully with an "unavailable" message).
    # The deploy job therefore does NOT depend on this job.
    needs: [staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      # Cache the 272MB tgz (Reactome regenerates it per release; refresh
      # weekly) — also avoids flaky CI downloads.
      - name: Cache Reactome diagrams tgz
        uses: actions/cache@v4
        with:
          path: /tmp/diagrams.svg.tgz
          key: reactome-diagrams-tgz-2026-08-09
      - name: Download + extract + ship diagrams
        run: |
          if [ ! -s /tmp/diagrams.svg.tgz ]; then
            # Retry the download; validate the gzip magic bytes — the CI
            # runner once received a non-gzip payload (19s for 272MB).
            for i in 1 2 3; do
              curl -sfL https://reactome.org/download/current/diagrams.svg.tgz -o /tmp/diagrams.svg.tgz && break
              echo "download attempt $i failed, retrying in 10s"
              sleep 10
            done
          fi
          # gzip magic check (\x1f\x8b) — fail loudly if not gzip.
          head -c 2 /tmp/diagrams.svg.tgz | od -An -tx1 | grep -q "1f 8b" || { echo "ERROR: downloaded payload is not gzip"; exit 1; }
          mkdir -p /tmp/diagrams && tar -xzf /tmp/diagrams.svg.tgz -C /tmp/diagrams
          COUNT=$(ls /tmp/diagrams | wc -l)
          echo "extracted $COUNT diagrams"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/heurion/reactome-diagrams"
          # Stream via tar over ssh (faster than scp -r for thousands of files).
          tar -C /tmp/diagrams -cf - . | ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "tar -xf - -C /opt/heurion/reactome-diagrams"
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "ls /opt/heurion/reactome-diagrams | wc -l"

  cloudflare-ssl:
    name: Cloudflare SSL
    needs: [staging]
    runs-on: ubuntu-latest
    steps:
      - name: Set Cloudflare SSL to Full
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$ZONE_ID" ]; then exit 0; fi
          CURRENT=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" -H "Authorization: Bearer $CF_TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.result.value)}catch(e){console.log('')}})" 2>/dev/null)
          if [ "$CURRENT" != "full" ] && [ "$CURRENT" != "strict" ]; then
            curl -sS -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"full"}'
          fi

  deploy:
    name: Deploy to Production (Docker Compose)
    # #466-fix: provision-reactome-diagrams is intentionally NOT in needs —
    # external-resource failures must not block the core deploy.
    needs: [staging, cloudflare-ssl, build-server-image, build-web, build-embedding-server-image, build-stats-worker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://heurion.org
    steps:
      - uses: actions/checkout@v4

      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Write production env
        env:
          HOSTNAME: heurion.org
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          EXECUTION_PLANE_URL: ${{ secrets.EXECUTION_PLANE_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cat > /tmp/heurion-deploy.env <<EOF
          HOSTNAME=${HOSTNAME}
          SERVER_HOST=0.0.0.0
          SERVER_PORT=8001
          ENVIRONMENT=production
          LOG_LEVEL=INFO
          SERVER_SECRET=${SERVER_SECRET}
          CORS_ALLOW_ORIGINS=https://${HOSTNAME}
          DEFAULT_LLM_PROVIDER=opencode
          DEFAULT_LLM_MODEL=deepseek-v4-flash
          OPENCODE_API_KEY=${OPENCODE_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          # #283: email verification delivery (Resend) — falls back to
          # console logging in dev when unset.
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=Heurion <no-reply@heurion.org>
          EXECUTION_PLANE_URL=${EXECUTION_PLANE_URL}
          WORKER_API_TOKEN=${WORKER_API_TOKEN}
          CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
          CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
          EMBEDDING_PROVIDER=local
          # #442: model default unified to bge-m3 across embedding-server,
          # the index label and the deploy env — a mismatch would silently
          # change vector dimensions (384 vs 1024).
          EMBEDDING_MODEL=BAAI/bge-m3
          EMBEDDING_BATCH_SIZE=32
          EMBEDDING_FALLBACK_PROVIDER=none
          LOCAL_EMBEDDING_URL=http://nexus-embedding-server:8003/embed
          OPENAI_EMBEDDING_MODEL=text-embedding-3-small
          EOF

      - name: Free disk space on VPS (stale images, builder caches, logs)
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "            docker system prune -af 2>/dev/null || true;             docker builder prune -af 2>/dev/null || true;             journalctl --vacuum-size=100M 2>/dev/null || true;             find /var/log -name '*.gz' -delete 2>/dev/null || true;             rm -rf /tmp/* /var/tmp/* 2>/dev/null || true;             df -h / | tail -1"

      - name: Deploy production via Docker Compose
        env:
          NEXUS_IMAGE: ${{ env.SERVER_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          EMBEDDING_IMAGE: ${{ env.EMBEDDING_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          STATS_IMAGE: ${{ env.STATS_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/heurion/packages/web/dist /opt/heurion/scripts && rm -rf /opt/heurion/packages/web/dist/assets"
          scp -o StrictHostKeyChecking=no -r packages/web/dist/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/packages/web/dist/
          scp -o StrictHostKeyChecking=no /tmp/heurion-deploy.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/.env.production
          scp -o StrictHostKeyChecking=no docker-compose.yml Caddyfile ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/
          scp -o StrictHostKeyChecking=no scripts/deploy-production-compose.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/heurion/scripts/
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/heurion && chmod +x scripts/deploy-production-compose.sh && NEXUS_IMAGE=$NEXUS_IMAGE EMBEDDING_IMAGE=$EMBEDDING_IMAGE STATS_IMAGE=$STATS_IMAGE bash scripts/deploy-production-compose.sh"

      - name: Purge Cloudflare cache (stale HTML references removed bundles)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$ZONE_ID" ]; then echo "no CF creds, skipping purge"; exit 0; fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.success?'CF cache purged':('purge failed: '+JSON.stringify(j.errors))) }catch(e){console.log('purge response unparsable')}})"

