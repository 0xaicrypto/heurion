name: Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WORKER_IMAGE_NAME: ghcr.io/0xaicrypto/heurion-worker

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - run: cd packages/server-ts && pnpm install --frozen-lockfile && npx prisma generate && npx tsc --noEmit

  test:
    name: Unit Tests
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: '10' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: packages/server-ts/pnpm-lock.yaml }
      - run: cd packages/server-ts && pnpm install --frozen-lockfile && npx prisma generate && npx vitest run

  build-worker-image:
    name: Build Worker Image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ${{ env.WORKER_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
            ${{ env.WORKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Staging + Regression
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy staging + regression
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          scp -o StrictHostKeyChecking=no scripts/deploy-staging.sh scripts/regression-test.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/heurion/scripts/
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ~/heurion && DEEPSEEK_KEY=$DEEPSEEK_KEY GEMINI_KEY=$GEMINI_KEY bash scripts/deploy-staging.sh && bash scripts/regression-test.sh http://localhost:8002"

  cloudflare-ssl:
    name: Cloudflare SSL
    needs: [staging]
    runs-on: ubuntu-latest
    steps:
      - name: Set Cloudflare SSL to Full
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$ZONE_ID" ]; then exit 0; fi
          CURRENT=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['value'])")
          if [ "$CURRENT" != "full" ] && [ "$CURRENT" != "strict" ]; then
            curl -sS -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/ssl" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"value":"full"}'
          fi

  deploy:
    name: Deploy to Production
    needs: [staging, cloudflare-ssl, build-worker-image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://heurion.org
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy production
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          EXECUTION_PLANE_URL: ${{ secrets.EXECUTION_PLANE_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          printf 'DEEPSEEK_KEY=%s\nGEMINI_KEY=%s\nSERVER_SECRET=%s\nEXECUTION_PLANE_URL=%s\nWORKER_API_TOKEN=%s\n' \
            "$DEEPSEEK_KEY" "$GEMINI_KEY" "$SERVER_SECRET" "$EXECUTION_PLANE_URL" "$WORKER_API_TOKEN" > /tmp/heurion-deploy.env
          scp -o StrictHostKeyChecking=no /tmp/heurion-deploy.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/heurion-deploy.env
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'set -a; source /tmp/heurion-deploy.env; rm -f /tmp/heurion-deploy.env; bash -s' < scripts/deploy.sh || echo 'SSH pipe closed (deploy OK)'
          rm -f /tmp/heurion-deploy.env

  deploy-execution-plane:
    name: Deploy Execution Plane
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WORKER_VPS_SSH_KEY }}
      - name: Extract short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy worker stack
        env:
          WORKER_IMAGE_TAG: ${{ steps.vars.outputs.sha }}
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          printf 'WORKER_IMAGE_TAG=%s\nSERVER_SECRET=%s\nDEEPSEEK_KEY=%s\nGEMINI_KEY=%s\nS3_ENDPOINT=%s\nS3_BUCKET=%s\nS3_REGION=%s\nS3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\nWORKER_API_TOKEN=%s\n' \
            "$WORKER_IMAGE_TAG" "$SERVER_SECRET" "$DEEPSEEK_KEY" "$GEMINI_KEY" "$S3_ENDPOINT" "$S3_BUCKET" "$S3_REGION" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" "$WORKER_API_TOKEN" > /tmp/heurion-worker-deploy.env
          scp -o StrictHostKeyChecking=no /tmp/heurion-worker-deploy.env scripts/deploy-worker.sh docker-compose.worker.yml ${{ secrets.WORKER_VPS_USER }}@${{ secrets.WORKER_VPS_HOST }}:~/heurion/
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.WORKER_VPS_USER }}@${{ secrets.WORKER_VPS_HOST }} \
            'cd ~/heurion && set -a; source heurion-worker-deploy.env; rm -f heurion-worker-deploy.env; bash deploy-worker.sh'
          rm -f /tmp/heurion-worker-deploy.env
