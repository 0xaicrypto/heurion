# 一次性运维：恢复生产 embedding（staging embedding OOM 挤压事故）。
# 只读+有界动作：停 staging embedding → 重启生产 embedding → 等健康。
name: VPS Embedding Recover

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Stop staging embedding + restart prod embedding
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '=== before: memory ==='; free -h;
            echo '=== stop staging embedding (free ~3GB) ===';
            sudo docker stop nexus-embedding-staging 2>/dev/null || true;
            echo '=== restart prod embedding ===';
            sudo docker restart nexus-embedding-server 2>/dev/null || true;
            echo '=== wait prod embedding /health (up to 5min) ===';
            ok=0; for i in \$(seq 1 60); do
              if sudo docker exec nexus-embedding-server curl -fsS http://localhost:8003/health >/dev/null 2>&1; then ok=1; break; fi
              sleep 5;
            done;
            echo \"embedding health ok=\$ok\";
            echo '=== after: memory ==='; free -h;
            echo '=== containers ==='; sudo docker ps --format '{{.Names}}\t{{.Status}}';
            echo '=== recent OOM (last 10min) ==='; sudo dmesg -T 2>/dev/null | grep -i 'oom-kill\\|Out of memory' | tail -5 || true;
          "
      - name: Verify production
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://heurion.org/healthz || true)
            [ "$CODE" = "200" ] && echo "✓ production healthy" && exit 0
            sleep 5
          done
          echo "::error::production healthz not 200 (last $CODE)"; exit 1
