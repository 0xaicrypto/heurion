# 一次性/诊断探针 — 长期不用可删（#924 归档标记）
# 用途：手动触发，SSH 到 VPS 深度清理磁盘（docker system prune -a / builder prune / journal vacuum）。
# 注意：prune -a 会删除未使用镜像，属有损运维操作，仅在磁盘告急时用。
# 归档建议见 .github/workflows/README.md
name: VPS Disk Clean

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deep clean disk (unused images, volumes, containerd content)
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '=== before ==='; df -h /;
            sudo docker system prune -a -f 2>/dev/null || true;
            sudo ctr -n moby content prune -f 2>/dev/null || true;
            sudo docker builder prune -a -f 2>/dev/null || true;
            sudo journalctl --vacuum-time=2d 2>/dev/null || true;
            echo '=== after ==='; df -h /;
            echo '=== /var breakdown ==='; sudo du -xhd1 /var 2>/dev/null | sort -rh | head -8
          "
