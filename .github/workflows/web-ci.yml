# Web UI CI — ensures code quality for packages/web on every change.
#
# Runs on PRs and pushes to main. Verifies:
#   - pnpm install succeeds
#   - TypeScript compiles
#   - ESLint passes
#   - Production build succeeds
#
# This workflow does NOT deploy; deployment of the web bundle is handled
# by the server deploy pipeline, which bakes packages/web/dist into the
# Docker image.

name: Web UI CI

on:
  pull_request:
    paths:
      - 'packages/web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

# 省配额:同分支/PR 新推送取消未完成的旧 run
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  build-and-lint:
    name: Build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: packages/web/pnpm-lock.yaml

      - name: Build shared contracts (drift guard)
        # #fix: contracts built BEFORE consumers install — pnpm snapshots the
        # file: dependency at install time (see worker-ci.yml).
        run: cd ../contracts && pnpm install --frozen-lockfile && pnpm build

      - name: Build llm-markdown-fix
        # #917: dist 不再入库 — web 的 file: 依赖在 install 时快照目录，
        # 必须先 build 产 dist 再 install（与 contracts 同理）。
        run: cd ../llm-markdown-fix && pnpm install --frozen-lockfile && pnpm build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # #CI-fix: the unit/component suite (SSE parser, chat store, chat
      # surfaces, api composition) must run on every web change.
      - name: Test
        run: pnpm exec vitest run --testTimeout=20000

      - name: Build
        run: pnpm build

      # #947: i18n key 存在性校验 — 报告模式（缺失不阻塞,131 key 批量补全
      # 后切为门禁模式；脚本无参 = 阻塞校验）。
      - name: i18n key audit (report)
        run: node ../../scripts/check-i18n-keys.mjs --report

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/dist
          retention-days: 1
