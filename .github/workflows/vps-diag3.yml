name: VPS diag3 (temp)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Diagnose containers
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            echo "===== ALL DOCKER CONTAINERS (incl stopped) ====="
            sudo docker ps -a --format "{{.ID}} {{.Names}} {{.Status}} {{.Image}} {{.Ports}}"
            echo "===== PID->CONTAINER MAP ====="
            for pid in 2395240 2392989 2388074 2395548; do
              cg=$(cat /proc/$pid/cgroup 2>/dev/null | tr "\n" " ")
              echo "pid=$pid cgroup=$cg"
            done
            echo "===== DOCKER CONTAINER PROCESSES (top RSS) ====="
            for c in $(sudo docker ps -q); do
              name=$(sudo docker inspect -f "{{.Name}}" $c)
              top_pid=$(sudo docker inspect -f "{{.State.Pid}}" $c)
              rss=$(sudo awk "/VmRSS/{print \$2}" /proc/$top_pid/status 2>/dev/null)
              echo "$name pid=$top_pid rss=${rss}kB"
            done
            echo "===== WHO WRITES DISK (top io) ====="
            sudo iotop -b -n 1 -o -qqq 2>/dev/null | head -8 || echo "iotop unavailable"
            echo "===== PM2 logs size ====="
            du -sh ~/.pm2/logs 2>/dev/null; ls -la ~/.pm2/logs 2>/dev/null | tail -8
            echo "===== FREE DISK ====="
            df -h / | tail -1
          ' 2>&1 | tail -80