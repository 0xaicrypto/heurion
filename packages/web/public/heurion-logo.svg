<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 374 105" width="374" height="105">
  <!-- #929跟进: 锁定 textLength + viewBox 与内容同界 — 内容在框内水平居中(0..374),
       跨平台系统字体的字宽漂移由 lengthAdjust 吸收, mx-auto 居中不再偏左。 -->
  <g fill="#0F172A">
    <!-- H icon vertical bars -->
    <rect x="0" y="10" width="18" height="80" rx="9"/>
    <rect x="62" y="30" width="18" height="60" rx="9"/>
  </g>
  <g fill="#0EA5E9">
    <!-- H icon accent bar + dot -->
    <rect x="14" y="42" width="52" height="18" rx="9"/>
    <circle cx="80" cy="20" r="11"/>
  </g>
  <text x="114" y="64" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="600" letter-spacing="2" textLength="260" lengthAdjust="spacing" fill="#0F172A">HEURION</text>
  <text x="114" y="96" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="3" textLength="260" lengthAdjust="spacing" fill="#475569">CLINICAL AI WORKSTATION</text>
</svg>
