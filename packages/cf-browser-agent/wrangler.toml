name = "heurion-browser-agent"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
LLM_BASE_URL = "https://opencode.ai/zen/go/v1"
LLM_MODEL = "deepseek-v4-flash"
# LLM_API_KEY set via wrangler secret in prod (OPENCODE_API_KEY)

[browser]
binding = "BROWSER"
