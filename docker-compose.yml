# Heurion server — production deployment via docker compose.
#
# Two services:
#   1. nexus-server — the FastAPI app. Persistent state on /data volume.
#   2. caddy        — reverse proxy with automatic HTTPS. Uses nip.io
#                     to get a free Let's Encrypt cert without owning
#                     a domain (you'll need ${PUBLIC_IP}.nip.io to
#                     resolve to your VPS).
#
# Remote access should run over HTTPS. With IP-only deployment the
# trick is to use a "hostname-encoded" service like nip.io (or
# sslip.io / xip.io). $PUBLIC_IP=1.2.3.4 → https://1-2-3-4.nip.io
# routes to your VPS and gets a real Let's Encrypt cert.

services:
  nexus-embedding-server:
    # Same image as nexus-server but runs the local embedding microservice.
    # sentence-transformers + the model cache live in the image /data volume.
    image: ${NEXUS_IMAGE:-nexus-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-embedding-server
    restart: unless-stopped
    command: ["nexus-embedding-server"]
    env_file:
      - .env.production
    environment:
      - EMBEDDING_SERVER_HOST=0.0.0.0
      - EMBEDDING_SERVER_PORT=8003
      - HF_HOME=/data/embedding-models
      - SENTENCE_TRANSFORMERS_HOME=/data/embedding-models
    volumes:
      - nexus-data:/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    # No public ports — only reachable on the internal Docker network.

  nexus-server:
    # In production, NEXUS_IMAGE is set by scripts/deploy/vps_deploy.sh
    # to a fully-qualified GHCR ref (e.g. ghcr.io/owner/nexus-server:
    # sha-abc1234). The default falls back to the locally-built
    # `nexus-server:latest` so existing local-dev workflows
    # (`docker compose up --build`) keep working without env tweaks.
    image: ${NEXUS_IMAGE:-nexus-server:latest}
    # Keeping `build:` here means `docker compose up --build` still
    # rebuilds against the local Dockerfile during development. In
    # production the image: tag wins because we never invoke --build,
    # so no accidental rebuild on the VPS.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-server
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # The reverse proxy is hitting us over plain HTTP on the docker
      # bridge; X-Forwarded-* headers from Caddy are how we know the
      # actual external scheme/host. uvicorn is started with
      # --proxy-headers --forwarded-allow-ips=*  inside the Dockerfile.
      - SERVER_PORT=8001
      - EMBEDDING_PROVIDER=local
      - LOCAL_EMBEDDING_URL=http://nexus-embedding-server:8003/embed
    volumes:
      # /data persistence — survives container rebuilds. The agent
      # installs new skills + MCP servers here at chat time, so
      # losing this volume = losing all learned tools.
      - nexus-data:/data
      # Web UI dist is built outside Docker (locally or in CI) and
      # mounted here so the droplet does not OOM building Node inside
      # the image. Update packages/web/dist and restart the container
      # to deploy front-end changes. Server Python code is baked into
      # the image; do NOT bind-mount it, or a missing host directory
      # will shadow the installed package and break imports.
      - ./packages/web/dist:/app/packages/web/dist:ro
    networks:
      - nexus-net
    depends_on:
      nexus-embedding-server:
        condition: service_healthy
    # No `ports:` here — Caddy is the only thing the host exposes.

  caddy:
    image: caddy:2-alpine
    container_name: nexus-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # required for ACME http-01 challenge
      - "443:443"   # actual HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # cert storage (Let's Encrypt account + certs)
      - caddy-config:/config    # caddy autosaves config
    environment:
      # Caddyfile reads ${HOSTNAME} from this — set it in .env.production
      # to your nip.io hostname (e.g. 1-2-3-4.nip.io).
      - HOSTNAME=${HOSTNAME}
    networks:
      - nexus-net
    depends_on:
      - nexus-server

volumes:
  nexus-data:
    # Named volume — `docker volume inspect nexus-data` shows the host
    # path. For backups: `tar czf nexus-backup.tgz <that path>`.
  caddy-data:
  caddy-config:

networks:
  nexus-net:
    driver: bridge
