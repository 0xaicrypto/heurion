# Heurion server — production deployment via docker compose.
#
# Two services:
#   1. nexus-server — the TypeScript server. Persistent state on /data volume.
#   2. caddy        — reverse proxy with automatic HTTPS. Uses nip.io
#                     to get a free Let's Encrypt cert without owning
#                     a domain (you'll need ${PUBLIC_IP}.nip.io to
#                     resolve to your VPS).
#
# Remote access should run over HTTPS. With IP-only deployment the
# trick is to use a "hostname-encoded" service like nip.io (or
# sslip.io / xip.io). $PUBLIC_IP=1.2.3.4 → https://1-2-3-4.nip.io
# routes to your VPS and gets a real Let's Encrypt cert.

services:
  nexus-embedding-server:
    # Node.js embedding server using Transformers.js (ONNX).
    # Model weights cached at build time in the image.
    image: ${EMBEDDING_IMAGE:-nexus-embedding-server:latest}
    build:
      context: packages/embedding-server
      dockerfile: Dockerfile
    container_name: nexus-embedding-server
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - EMBEDDING_SERVER_HOST=0.0.0.0
      - EMBEDDING_SERVER_PORT=8003
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    # No public ports — only reachable on the internal Docker network.

  nexus-stats-worker:
    # #404: Python statistics worker (scipy/statsmodels/lifelines).
    image: ${STATS_IMAGE:-nexus-stats-worker:latest}
    build:
      context: packages/python-stats-worker
      dockerfile: Dockerfile
    container_name: nexus-stats-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - STATS_HOST=0.0.0.0
      - STATS_PORT=8005
    networks:
      - nexus-net

  nexus-server:
    # TypeScript-based Nexus server. Built from packages/server-ts/Dockerfile.
    image: ${NEXUS_IMAGE:-nexus-server:latest}
    build:
      context: packages/server-ts
      dockerfile: Dockerfile
    container_name: nexus-server
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - SERVER_PORT=8001
      - DATABASE_URL=file:/data/db/nexus_server.db
      # #281: user memory files live under /data/twins on their own volume.
      - TWIN_BASE_DIR=/data/twins
      - WEB_DIST_DIR=/app/web-dist
    volumes:
      # /data persistence — cache, embedding models, misc (#281 remainder).
      - nexus-data:/data
      # #280: SQLite on its own volume — independent backups + fault isolation.
      - nexus-db-data:/data/db
      # #281: per-user memory files (facts/knowledge/embeddings/events) on
      # their own volume — independent backups from the DB.
      - nexus-files-data:/data/twins
      # Web UI dist mounted from host for fast front-end deploys.
      - ./packages/web/dist:/app/web-dist:ro
    networks:
      - nexus-net
    # No `ports:` here — Caddy is the only thing the host exposes.

  caddy:
    image: caddy:2-alpine
    container_name: nexus-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # required for ACME http-01 challenge
      - "443:443"   # actual HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # cert storage (Let's Encrypt account + certs)
      - caddy-config:/config    # caddy autosaves config
    environment:
      # Caddyfile reads ${HOSTNAME} from this — set it in .env.production
      # to your nip.io hostname (e.g. 1-2-3-4.nip.io).
      - HOSTNAME=${HOSTNAME}
    networks:
      - nexus-net
    depends_on:
      - nexus-server

volumes:
  nexus-data:
    # Named volume — `docker volume inspect nexus-data` shows the host
    # path. For backups: `tar czf nexus-backup.tgz <that path>`.
  nexus-db-data:
    # #280: SQLite database on its own volume — backup/restore the DB
    # independently from file storage.
  nexus-files-data:
    # #281: per-user memory files on their own volume.
  caddy-data:
  caddy-config:

networks:
  nexus-net:
    driver: bridge
